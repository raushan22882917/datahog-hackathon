apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-monitor-sa
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-monitor-role
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-monitor-rolebinding
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: llm-monitor-sa
  namespace: llm-monitor
roleRef:
  kind: Role
  name: llm-monitor-role
  apiGroup: rbac.authorization.k8s.io