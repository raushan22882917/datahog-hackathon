apiVersion: v1
kind: Service
metadata:
  name: llm-monitor-service
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: llm-monitor

---
apiVersion: v1
kind: Service
metadata:
  name: llm-monitor-headless
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: headless-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: llm-monitor