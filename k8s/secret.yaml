# NOTE: This is a template. Replace base64-encoded values with actual secrets.
# Use: echo -n "your-secret" | base64
apiVersion: v1
kind: Secret
metadata:
  name: llm-monitor-secrets
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-observability-monitor
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Replace these with actual base64-encoded values
  GOOGLE_CLOUD_PROJECT_ID: <base64-encoded-project-id>
  DATADOG_API_KEY: <base64-encoded-datadog-api-key>
  DATADOG_APP_KEY: <base64-encoded-datadog-app-key>
  # GCP Service Account JSON (base64 encoded)
  GCP_SERVICE_ACCOUNT: <base64-encoded-service-account-json>

---
# Example of how to create the secret using kubectl:
# kubectl create secret generic llm-monitor-secrets \
#   --from-literal=GOOGLE_CLOUD_PROJECT_ID=your-project-id \
#   --from-literal=DATADOG_API_KEY=your-datadog-api-key \
#   --from-literal=DATADOG_APP_KEY=your-datadog-app-key \
#   --from-file=GCP_SERVICE_ACCOUNT=./credentials/gcp-service-account.json \
#   --namespace=llm-monitor